<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Continuum (Project Onion) — Phase 2 ESM</title>
  <link rel="stylesheet" href="./css/styles.css">
  <!-- Zero-install local vendor (air-gapped): no CDN. React 18 UMD + HTM + SheetJS -->
  <script src="./js/vendor/react.production.min.js"></script>
  <script src="./js/vendor/react-dom.production.min.js"></script>
  <script src="./js/vendor/htm.umd.js"></script>
  <script src="./js/vendor/xlsx.full.min.js"></script>
</head>
<script>
(async () => {
  const params = new URLSearchParams(location.search);
  const shouldSync = params.has('sync') || localStorage.getItem('enableBackgroundSync') === 'true';
  if (!shouldSync) return;
  try {
    // DYNAMIC - read active project, not hard-coded apollo-123
    const activeProject = localStorage.getItem('activeProject') ||
                          localStorage.getItem('onion_active_project') ||
                          JSON.parse(localStorage.getItem('onion_projects')||'[]')[0]?.Project_ReferenceID ||
                          '';
    const res = await fetch('http://localhost:8006/list', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({query:'', project: activeProject, activePersona: localStorage.getItem('activePersona')||'Brené', privacyMode:'Both'})
    });
    const data = await res.json();
    if (!data || data.count === 0) {
      console.log('[Sync] Vector empty, keeping Local - project:', activeProject);
      return;
    }
    console.log(`[Sync] Vector has ${data.count} cards for project ${activeProject}, marking synced`);
    localStorage.setItem('lastVectorSyncAt', new Date().toISOString());
    localStorage.removeItem('enableBackgroundSync');
  } catch(e) {
    console.warn('[Sync] Vector not reachable, keeping offline Local', e);
  }
})();
</script>
<body>
  <div id="root"><p style="padding:16px;font-family:sans-serif;">Loading Project Continuum ESM…</p></div>
  <script type="module" src="./js/main.js?v=handoverfix1"></script>
</body>
</html>
