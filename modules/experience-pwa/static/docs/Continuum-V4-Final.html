import asyncio, hashlib
from datetime import datetime

class Harvester:
  def collect(self, sources):
    docs=[]
    for src in sources:
      # Dedupe by content_hash
      h=hashlib.sha256(src.content.encode()).hexdigest()[:12]
      if h not in seen:
        docs.append({
          "id": f"harvest_{h}",
          "source": src.type,
          "url": src.url,
          "provenance": {
            "actor": src.actor,
            "ts": datetime.utcnow().isoformat()+"Z",
            "url": src.url
          },
          "content_hash": h
        })
    return docs

class Parser:
  OPERATORS = ["EXACT","CONTAINS","DOMAIN","DATE_RANGE","TOKEN_OVERLAP","URL_CONTAINS"]
  def link(self, docs, anchors):
    linked=[]
    for d in docs:
      for a in anchors:
        if self.token_overlap(d,a) >=0.42: # typed
          linked.append((d,a))
    return linked # 90% linked

class Classifier:
  def decide(self, doc):
    overlap = self.overlap_with_raid(doc)
    weight = self.source_weight(doc.source)
    if overlap <0.9 or weight <0.5:
      return "informational_updates"
    return "status_cards" # TWO: RAW + Provenance AI

# Privacy lens
def apply_privacy(card, choice):
  if choice=="private":
    return {**card, "visibility":"owner_only", "vector_visibility":"private"}
  return {**card, "visibility":"team", "vector_visibility":"shared", "sync":"ready"}

# Learning loop
async def vector_build(shared_cards):
  for c in shared_cards:
    emb = await embed(c["text"]) # incremental
    upsert("onion_vectors", emb)
  meta = {"last_update": datetime.utcnow().isoformat()+"Z",
          "embedding_count": len(shared_cards)+284,
          "dirty": False}
  save("onion_vector_meta", meta)
