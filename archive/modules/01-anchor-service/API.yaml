# API Contract — Anchor Service — Client/Project Onboarding
openapi: 3.0.0
info:
  title: Anchor Service — Client/Project Onboarding
  version: v1.0
paths:
  /01-anchor-service/health:
    get:
      summary: Health check
      responses:
        '200': { description: ok }
  /01-anchor-service/process:
    post:
      summary: Process Anchor Service — Client/Project Onboarding
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                anchor_id: { type: string }
                client_name: { type: string }
                project_id: { type: string }
                source_link: { type: string }
                lastModified: { type: string }
      responses:
        '200':
          description: idempotent result
          content:
            application/json:
              schema:
                type: object
                properties:
                  clip_id: { type: string, description: hash(url+lastModified+anchor) }
                  card_id: { type: string }
                  freshness: { type: string, example: 2d ago }
                  significance_score: { type: number, example: 0.9 }
