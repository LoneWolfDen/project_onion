name: PWA checks

# Runs the Experience PWA unit tests and the Playwright smoke checks
# (modules/experience-pwa/tests/) on every pull request and on pushes to main.
# Mirrors docs/TESTING.md: `node --test` for pure functions, smoke.mjs for the
# browser flow against the built-in demo dataset.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: pwa-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # OPS-03: trust-boundary tests as their own check. Mark "critical-tests" as a required status
  # check in the branch rules so a failure blocks merging; release-gate.yml re-runs it on tags.
  critical-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Trust-boundary tests
        run: node --test modules/experience-pwa/tests/trust-boundary.test.mjs

  pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Repo hygiene (runtime DBs, personal paths, secrets)
        run: node scripts/check-repo.mjs

      - name: CSS dependencies still defined (HUI-04)
        run: node scripts/css-usage.mjs --check

      - name: Local services are loopback-only
        run: |
          python -m pip install -q fastapi httpx
          python -m unittest discover -s modules/_shared/tests -v
          python -m unittest discover -s modules/vector-service/tests -v

      - name: Unit tests
        run: node --test modules/experience-pwa/tests/*.test.mjs

      # Pinned to the version the smoke script was developed against.
      - name: Install Playwright + Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      # smoke.mjs starts service.py itself (stdlib only, no pip install needed).
      - name: Smoke checks
        env:
          KEEP_SHOTS: ${{ runner.temp }}/shots
        run: node modules/experience-pwa/tests/smoke.mjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pwa-smoke-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
          retention-days: 7
